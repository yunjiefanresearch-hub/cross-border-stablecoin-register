id: tw-frs-regulatory_authority-001
jurisdiction: TW
authority: FSC (primary; consults the CBC)
instrument_type: fiat_referenced_stablecoin
instrument_label_local: virtual asset / stablecoin (Virtual Asset Service Act, promulgated; commencement pending)
dimension: regulatory_authority
requirement_summary: 'Two layers, only one in force. In force: AML registration under the amended Money Laundering
  Control Act and the VASP Registration Regulations (effective 30 November 2024). Enacted but not commenced: the
  Virtual Asset Service Act, a comprehensive statute creating FSC licensing for virtual-asset services including
  stablecoin issuance, with mandatory central-bank consultation; passed at third reading 30 June 2026, awaiting
  FSC subsidiary legislation for commencement. The FSC is the primary regulator and consults the Central Bank of
  the Republic of China (Taiwan) (CBC) on stablecoin matters.'
requirement_structured:
  in_force_layer: AML registration (amended Money Laundering Control Act + VASP Registration Regulations, 30 Nov
    2024)
  enacted_not_commenced_layer: Virtual Asset Service Act (promulgated 22 Jul 2026; licensing commencement pending)
  primary_regulator: FSC
  central_bank_role: CBC consulted (onshore-NTD posture is the live question)
status: in_force
effective_date: '2024-11-30'
