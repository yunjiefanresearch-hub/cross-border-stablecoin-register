name: Gold coverage evidence (not certification)

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      enforce_thresholds:
        description: Fail unless measured Python coverage reaches 90% statements and 80% branches
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  coverage-evidence:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked test and measurement tooling
        run: |
          python -m pip install --constraint constraints/dev.txt pip setuptools wheel
          python -m pip install --constraint constraints/dev.txt ".[dev]"
          python -m pip install -r constraints/quality.txt
      - name: Measure all Python source (unexecuted files count)
        run: |
          python -m coverage run -m pytest -q
          python -m coverage json
          python -m coverage html
          python tools/check_gold_coverage.py
      - name: Enforce Gold coverage thresholds when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.enforce_thresholds
        run: python tools/check_gold_coverage.py --enforce
      - name: Upload measured evidence regardless of threshold outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gold-coverage-${{ github.sha }}
          path: |
            artifacts/validation/coverage.json
            artifacts/validation/gold-coverage.json
            artifacts/validation/coverage-html/
          if-no-files-found: error
          retention-days: 30
