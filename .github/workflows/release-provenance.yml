name: Release provenance

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints/dev.txt
      - name: Install reviewed graph and run canonical verifier
        run: |
          python -m pip install --constraint constraints/dev.txt pip setuptools wheel
          python -m pip install --constraint constraints/dev.txt ".[dev]"
          python -m tools.verify
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/cbsr_mcp-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: cbsr-release-evidence-${{ github.run_id }}
          path: |
            dist/
            artifacts/validation/
          if-no-files-found: error
