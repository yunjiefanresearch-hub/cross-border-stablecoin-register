name: Release provenance

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-wheel:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt
      - name: Install reviewed graph and run canonical verifier
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r constraints/dev-hashes.txt
          python -m tools.verify
      - name: Prepare release assets in the read-only job
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/validation/verify-summary.json dist/verify-summary.json
          (
            cd dist
            sha256sum -- *.whl *.json > SHA256SUMS
          )
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cbsr-release-evidence-${{ github.run_id }}
          path: |
            dist/
            artifacts/validation/
          if-no-files-found: error

  attest-wheel:
    needs: verify-wheel
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # This privileged job neither checks out nor executes repository code.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cbsr-release-evidence-${{ github.run_id }}
          path: release-evidence
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-evidence/dist/cbsr_mcp-*.whl

  publish-release-assets:
    if: github.event_name == 'release'
    needs: attest-wheel
    runs-on: ubuntu-24.04
    permissions:
      # Required by the release-asset upload API; never available to builds.
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cbsr-release-evidence-${{ github.run_id }}
          path: release-evidence
      - name: Upload verified assets to the published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            release-evidence/dist/*.whl \
            release-evidence/dist/*.json \
            release-evidence/dist/SHA256SUMS \
            --repo "$GH_REPO"
