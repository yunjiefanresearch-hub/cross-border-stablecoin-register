name: Release provenance

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - delivery/release-request.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-wheel:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
      wheel: ${{ steps.release.outputs.wheel }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt
      - name: Install reviewed graph and run canonical verifier
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r constraints/dev-hashes.txt
          python -m tools.verify
      - name: Prepare the declared release bundle after verification
        id: release
        run: python -m tools.prepare_release --output artifacts/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cbsr-release-evidence-${{ github.run_id }}
          path: artifacts/release/
          if-no-files-found: error

  attest-wheel:
    needs: verify-wheel
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # This privileged job neither checks out nor executes repository code.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cbsr-release-evidence-${{ github.run_id }}
          path: release-evidence
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-evidence/assets/${{ needs.verify-wheel.outputs.wheel }}

  publish-release-assets:
    if: github.event_name == 'release' || github.event_name == 'push'
    needs: [verify-wheel, attest-wheel]
    runs-on: ubuntu-24.04
    permissions:
      # Required by the release-asset upload API; never available to builds.
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cbsr-release-evidence-${{ github.run_id }}
          path: release-evidence
      - name: Create the requested release from verified assets
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify-wheel.outputs.tag }}
          RELEASE_TITLE: ${{ needs.verify-wheel.outputs.title }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$RELEASE_COMMIT"
          gh release create "$RELEASE_TAG" release-evidence/assets/* \
            --verify-tag \
            --title "$RELEASE_TITLE" \
            --notes-file release-evidence/release-notes.md \
            --repo "$GH_REPO"
      - name: Upload verified assets to the published release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-evidence/assets/* \
            --repo "$GH_REPO"
