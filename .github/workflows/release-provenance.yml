name: Release provenance

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest-wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/runtime.txt
            constraints/dev.txt
      - name: Install reviewed graph and run canonical verifier
        run: |
          python -m pip install --constraint constraints/dev.txt pip setuptools wheel
          python -m pip install --constraint constraints/dev.txt ".[dev]"
          python -m tools.verify
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/cbsr_mcp-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: cbsr-release-evidence-${{ github.run_id }}
          path: |
            dist/
            artifacts/validation/
          if-no-files-found: error

  publish-release-assets:
    if: github.event_name == 'release'
    needs: attest-wheel
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cbsr-release-evidence-${{ github.run_id }}
          path: release-evidence
      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp release-evidence/artifacts/validation/verify-summary.json \
            release-evidence/dist/verify-summary.json
          (
            cd release-evidence/dist
            sha256sum -- *.whl *.json > SHA256SUMS
          )
      - name: Upload verified assets to the published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            release-evidence/dist/*.whl \
            release-evidence/dist/*.json \
            release-evidence/dist/SHA256SUMS \
            --repo "$GH_REPO"
