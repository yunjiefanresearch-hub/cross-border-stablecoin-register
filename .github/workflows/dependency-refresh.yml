name: dependency constraint review

on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check reviewed compatibility windows for newer stable releases
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --require-hashes --only-binary=:all: -r constraints/bootstrap-hashes.txt
          python tools/refresh_constraints.py --check 2>&1 | tee constraint-refresh.txt
      - name: Preserve the review result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: constraint-review-${{ github.run_id }}
          path: constraint-refresh.txt
          if-no-files-found: warn
          retention-days: 30
