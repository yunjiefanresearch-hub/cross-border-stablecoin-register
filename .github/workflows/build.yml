name: CBSR canonical verification

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  CBSR_BUILD_DATE: "2026-08-20"

jobs:
  python-matrix:
    name: verify-python-${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure verifier cache paths
        shell: bash
        run: |
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/cbsr-pip-cache" >> "$GITHUB_ENV"
          echo "CBSR_PIP_CACHE_DIR=$RUNNER_TEMP/cbsr-pip-cache" >> "$GITHUB_ENV"
          echo "CBSR_PIP_AUDIT_CACHE_DIR=$RUNNER_TEMP/cbsr-pip-audit-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Install the reviewed dependency graph
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r constraints/dev-hashes.txt

      - name: Run the only canonical verifier
        shell: bash
        run: |
          set -o pipefail
          python -m tools.verify 2>&1 | tee "verify-python-${{ matrix.python-version }}.log"

      - name: Preserve machine-readable evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verify-python-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            verify-python-${{ matrix.python-version }}.log
            artifacts/validation/
            dist/*.json
            dist/*.whl
          if-no-files-found: warn
          retention-days: 30

  windows-clean-room:
    name: verify-windows-clean-room-python-3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure verifier cache paths
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "PIP_CACHE_DIR=$env:RUNNER_TEMP\cbsr-pip-cache"
          Add-Content -Path $env:GITHUB_ENV -Value "CBSR_PIP_CACHE_DIR=$env:RUNNER_TEMP\cbsr-pip-cache"
          Add-Content -Path $env:GITHUB_ENV -Value "CBSR_PIP_AUDIT_CACHE_DIR=$env:RUNNER_TEMP\cbsr-pip-audit-cache"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Run the documented Windows clean-room path
        shell: pwsh
        run: >-
          ./setup_windows.ps1
          -Python python
          -Recreate
          -EvidenceDir artifacts/validation/windows

      - name: Preserve Windows transcript and evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verify-windows-clean-room-${{ github.run_id }}
          path: |
            artifacts/validation/windows/
            dist/*.json
            dist/*.whl
          if-no-files-found: warn
          retention-days: 30

  required-verification:
    name: required-verification
    if: always()
    needs: [python-matrix, windows-clean-room]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce all platform jobs
        env:
          MATRIX_RESULT: ${{ needs.python-matrix.result }}
          WINDOWS_RESULT: ${{ needs.windows-clean-room.result }}
        run: |
          test "$MATRIX_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
