name: CBSR canonical verification

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  CBSR_BUILD_DATE: "2026-08-20"

jobs:
  python-matrix:
    name: verify-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      PIP_CACHE_DIR: ${{ runner.temp }}/cbsr-pip-cache
      CBSR_PIP_CACHE_DIR: ${{ runner.temp }}/cbsr-pip-cache
      CBSR_PIP_AUDIT_CACHE_DIR: ${{ runner.temp }}/cbsr-pip-audit-cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/runtime.txt
            constraints/dev.txt

      - name: Install the reviewed dependency graph
        run: |
          python -m pip install --constraint constraints/dev.txt pip setuptools wheel
          python -m pip install --constraint constraints/dev.txt ".[dev]"

      - name: Run the only canonical verifier
        shell: bash
        run: |
          set -o pipefail
          python -m tools.verify 2>&1 | tee "verify-python-${{ matrix.python-version }}.log"

      - name: Preserve machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-python-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            verify-python-${{ matrix.python-version }}.log
            artifacts/validation/
            dist/*.json
            dist/*.whl
          if-no-files-found: warn
          retention-days: 30

  windows-clean-room:
    name: verify-windows-clean-room-python-3.12
    runs-on: windows-latest
    env:
      PIP_CACHE_DIR: ${{ runner.temp }}/cbsr-pip-cache
      CBSR_PIP_CACHE_DIR: ${{ runner.temp }}/cbsr-pip-cache
      CBSR_PIP_AUDIT_CACHE_DIR: ${{ runner.temp }}/cbsr-pip-audit-cache
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/runtime.txt
            constraints/dev.txt

      - name: Run the documented Windows clean-room path
        shell: pwsh
        run: >-
          ./setup_windows.ps1
          -Python python
          -Recreate
          -EvidenceDir artifacts/validation/windows

      - name: Preserve Windows transcript and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-windows-clean-room-${{ github.run_id }}
          path: |
            artifacts/validation/windows/
            dist/*.json
            dist/*.whl
          if-no-files-found: warn
          retention-days: 30

  required-verification:
    name: required-verification
    if: always()
    needs: [python-matrix, windows-clean-room]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all platform jobs
        env:
          MATRIX_RESULT: ${{ needs.python-matrix.result }}
          WINDOWS_RESULT: ${{ needs.windows-clean-room.result }}
        run: |
          test "$MATRIX_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
