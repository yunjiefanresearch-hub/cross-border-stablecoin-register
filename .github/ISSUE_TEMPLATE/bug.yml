name: Bug report
description: Report a reproducible defect in code, API, MCP tooling, build or documentation.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior without including secrets or personal data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands, input and output. Redact sensitive values.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: CBSR version or revision
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety and verification
      options:
        - label: I ran `python -m tools.verify` or explained why it could not run.
          required: true
        - label: This report contains no credential, private exploit or client-specific legal data.
          required: true
