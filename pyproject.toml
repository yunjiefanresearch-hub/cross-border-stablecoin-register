[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbsr-mcp"
version = "0.11.0"
description = "MCP server for the Cross-Border Stablecoin Register (CBSR): typed query tools over an open, versioned register of cross-border stablecoin regulation across twelve jurisdictions."
readme = "README-PYPI.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Yunjie Fan" }]
keywords = [
  "mcp", "model-context-protocol", "stablecoin", "regulation",
  "cross-border", "compliance", "regtech", "legal", "register",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  # FastMCP public surface targeted by the Python 3.10-3.13 CI matrix.
  "mcp>=1.29,<1.30",
  # MCP 1.29 emits IncompleteFieldDefinitionWarning with the Pydantic 2.13+
  # resolver. Pydantic Settings 2.14.2 contains the current secrets-path fix
  # and remains warning-free with Pydantic 2.12.5.
  "pydantic>=2.12,<2.14",
  "pydantic-settings>=2.14.2,<2.15",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "hatchling>=1,<2",
  "jsonschema>=4.21,<5",
  "packaging>=24,<27",
  "PyYAML>=6,<7",
  "pytest>=8,<9",
  "pip-audit>=2.10,<2.11",
  "pypdf>=6.10,<6.11",
  "reportlab>=4.4,<4.5",
  "tomli>=2,<3; python_version<'3.11'",
]

[project.urls]
Homepage      = "https://github.com/yunjiefanresearch-hub/cross-border-stablecoin-register"
Repository    = "https://github.com/yunjiefanresearch-hub/cross-border-stablecoin-register"
Documentation = "https://github.com/yunjiefanresearch-hub/cross-border-stablecoin-register/blob/main/MCP_SERVER.md"

[project.scripts]
cbsr-mcp = "cbsr_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cbsr_mcp"]

# The register's single source of truth is the repo-root dataset.json that build.py compiles.
# It is mapped INTO the wheel rather than duplicated in the tree, so there is exactly one
# dataset.json in version control and the packaged server can never drift from the register.
# This is also what keeps the server's "no network calls" guarantee true once installed.
[tool.hatch.build.targets.wheel.force-include]
"dataset.json" = "cbsr_mcp/data/dataset.json"
"schemas/policy-action.v1.schema.json" = "cbsr_mcp/schemas/policy-action.v1.schema.json"
"schemas/policy-mandate.v1.schema.json" = "cbsr_mcp/schemas/policy-mandate.v1.schema.json"
"schemas/policy-decision.v1.schema.json" = "cbsr_mcp/schemas/policy-decision.v1.schema.json"
"schemas/policy-receipt.v1.schema.json" = "cbsr_mcp/schemas/policy-receipt.v1.schema.json"
"schemas/domain-pack.v1.schema.json" = "cbsr_mcp/schemas/domain-pack.v1.schema.json"
"schemas/legal-event-ontology.v1.schema.json" = "cbsr_mcp/schemas/legal-event-ontology.v1.schema.json"

[tool.hatch.build.targets.sdist]
include = ["src/cbsr_mcp", "dataset.json", "README-PYPI.md", "LICENSE-CODE", "pyproject.toml"]
