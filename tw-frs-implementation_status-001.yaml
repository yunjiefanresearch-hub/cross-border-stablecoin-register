requirement_summary: 'Two temporal layers coexist. AML registration has operated since 30 November 2024. The Virtual
  Asset Service Act passed third reading on 30 June 2026 and was promulgated in Presidential Gazette No. 7872 on
  22 July 2026. Its licensing and stablecoin provisions await subsidiary legislation and commencement; no licensed
  stablecoin issuer is evidenced in this snapshot, and the peg-currency policy remains unresolved.'
