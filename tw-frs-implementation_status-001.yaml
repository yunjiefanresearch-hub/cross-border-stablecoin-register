  regime_stage: comprehensive statute promulgated; operative licensing layer pending commencement
  milestones:
  - AML registration in force 30 Nov 2024
  - VASA committee first review 3 Jun 2026
  - VASA passed third reading 30 Jun 2026
  - VASA promulgated 22 Jul 2026; commencement and subsidiary rules pending
  issuers: none licensed
  peg_currency: undecided
