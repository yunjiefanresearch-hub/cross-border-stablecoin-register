requirement_summary: SI 2026/102 was made in February 2026 and the relevant issuer regime is scheduled to commence
  on 25 October 2027. The FCA published final stablecoin-issuance rules in PS26/10 in June 2026. The Bank of England
  published its systemic-stablecoin policy statement and draft Code of Practice in June 2026, followed by a joint
  Bank/FCA approach on 30 June 2026. Bank finalisation and record-level commencement mapping remain pending.
