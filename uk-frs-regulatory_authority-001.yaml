dimension: regulatory_authority
requirement_summary: The Financial Services and Markets Act 2000 (Cryptoassets) Regulations 2026, SI 2026/102, in
  force from February 2026, make issuing a qualifying stablecoin in the UK a regulated activity under FSMA. The
  FCA (conduct), Bank of England (systemic), and HM Treasury (perimeter) share authority. The FCA published PS26/10
  final issuance rules in June 2026; the Bank's June 2026 systemic policy includes a draft Code of Practice, and
  the authorities published their joint approach on 30 June 2026. The relevant regime commences 25 October 2027.
